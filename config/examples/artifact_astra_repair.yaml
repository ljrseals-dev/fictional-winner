# ARTIFACT + Astra + MAI-Code-1-Flash + dual-TSA / Rekor-v2 anchoring
# Copy and edit for your target model / failure mode

target_model: "Qwen/Qwen3.5-0.8B"
failure_mode: "natural-language description of the defect"

reasoning_agent:
  model: "gpt-6-astra"
  api_base: "https://api.openai.com/v1"
  # api_key via env OPENAI_API_KEY

code_specialist:
  model: "mai-code-1-flash"

weight_budget: 0.001                 # ≤ 0.1%
human_gate_threshold: 0.0005         # 0.05%

paths:
  artifact_root: "."
  audit_ledger: "audit/ledger.jsonl"
  checkpoints: "checkpoints/"
  probes: "probes/"
  edits: "edits/"
  reports: "reports/"

safety:
  no_knowledge_injection: true
  require_falsifiable_hypothesis: true
  rollback_on_any_failure: true
  rsi_mitigation: true

# --- Anchoring (Part 0 / Part 1 / Part 2) ---
anchoring:
  tsa:
    quorum: 2
    max_skew_s: 2.0
    max_accuracy_s: 1.0
    require_distinct_operators: true
    registry:
      digicert-primary:
        tsa_id: digicert-primary
        role: primary
        url: "http://timestamp.digicert.com"
        policy_oid: "2.16.840.1.114412.7.1"
        root_pem_path: "config/tsa-roots/digicert.pem"
        root_fingerprint_sha256: "REPLACE_ME"
        max_accuracy_s: 1.0
        jurisdiction: "US"
        time_source: "atomic"
      globalsign-witness:
        tsa_id: globalsign-witness
        role: witness
        url: "http://timestamp.globalsign.com/tsa/r6advanced1"
        policy_oid: "1.3.6.1.4.1.4146.2.2"
        root_pem_path: "config/tsa-roots/globalsign.pem"
        root_fingerprint_sha256: "REPLACE_ME"
        max_accuracy_s: 1.0
        jurisdiction: "BE"
        time_source: "atomic"

  tlog:
    # Resolve via TUF / signing-config; do not hardcode shard URLs long-term
    base_url: "https://log2025-1.rekor.sigstore.dev"
    origin: "rekor.sigstore.dev"
    log_public_key_pem: "config/tlog/rekor-log.pem"
    witnesses_required: 2
    max_checkpoint_age_s: 3600
    # witness_keys: loaded from operator-published material, not this file alone

  monitor:
    cadence_hours: 1
    freeze_on_p0: true
    require_signed_unfreeze: true

pipeline:
  phases:
    - probe
    - hypothesize
    - edit_proposal
    - verify
    - human_gate
    - pre_write_anchor   # dual-TSA, blocking
    - write
    - post_write_anchor  # run_anchor → Rekor v2
    - audit
  dry_run_first: true
